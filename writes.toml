# Commands that write but take no --yes flag, keyed by repo name.
#
# `outward` changes something other people or services see (a message, a page, a
# sheet, a like): MCP clients are told it is destructive and ask before running it.
# `local` only writes on this machine (downloads, caches, the secret vault): not
# read-only, but harmless. `read` lists commands whose name looks like a write but
# that only read, so `audit` stops flagging them. A command with a --yes flag is a
# write without being listed here. Paths are the subcommand words joined by spaces.

[bluestar-cli]
read = ["check"]

[deezer-cli]
read = ["resolve"]
outward = ["like", "unlike", "playlist-create", "playlist-add", "playlist-remove", "playlist-delete"]
local = ["export-likes", "download", "auth-sync"]

[ecoledirecte-cli]
outward = ["mark"]
local = ["download", "auth-sync", "link"]

[email-cli]
local = ["auth-sync"]

[fbarchive-cli]
local = ["import"]

[franc-tireur-cli]
local = ["dump", "pdf", "page"]

[gdrive-cli]
outward = ["drive rename", "drive import", "sheets write", "sheets write-formula", "sheets batch-write", "sheets clear"]
local = ["auth-sync", "drive download"]
read = ["pipeline pdf-to-table"]

[laposte-cli]
outward = ["send"]
local = ["auth-sync"]

[macos-osascript-cli]
outward = ["run", "tell"]

[milibris-cli]
local = ["set-host", "dump", "pdf"]

[myoralia-cli]
local = ["documents download", "documents sync", "connect"]

[notion-cli]
outward = ["append", "create", "update", "edit", "delete", "delete-block", "comment", "rewrite", "check", "resolve-discussion", "agents apply"]
local = ["cache clear", "auth-sync", "agents pull", "agents export", "connect"]
read = ["resolve"]

[one-conv-cli]
outward = ["live join", "live leave", "live stop"]
local = ["cloud chatgpt connect", "cloud claude connect", "cloud codex connect", "cloud cowork connect", "chatgpt sync", "cloud chatgpt pull", "cloud claude pull", "cloud codex pull", "cloud cowork pull", "tune cloud pull", "hr sync"]

[oz-audits-cli]
outward = ["submit"]
local = ["auth-sync"]

[refero-cli]
local = ["pull"]

[rentalready-cli]
local = ["auth-sync"]

[slack-user-cli]
outward = ["send", "draft", "draft-delete", "upload", "dm-upload", "canvas-edit"]
local = ["download", "auth-sync", "default", "refresh"]
read = ["resolve", "resolve-name"]

[tg-cli]
local = ["download", "auth-sync", "link"]

[whatsapp-cli]
outward = ["send"]
local = ["import-contacts", "download", "pull", "sync", "setup", "auth-sync", "link"]

[tchoupi-cli]
local = ["pdf"]
