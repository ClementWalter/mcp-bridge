# Commands that write but take no --yes flag, keyed by repo name.
#
# `outward` changes something other people or services see (a message, a page, a
# sheet, a like): MCP clients are told it is destructive and ask before running it.
# `local` only writes on this machine (downloads, caches, the secret vault): not
# read-only, but harmless. `read` lists commands whose name looks like a write but
# that only read, so `audit` stops flagging them. A command with a --yes flag is a
# write without being listed here. Paths are the subcommand words joined by spaces.

[bluestar-cli]
read = ["check"]

[deezer-cli]
read = ["resolve"]
outward = ["like", "unlike", "playlist-create", "playlist-add", "playlist-remove", "playlist-delete"]
local = ["export-likes", "download", "auth-sync"]

[doctolib-cli]
read = ["connect"]
local = ["download"]

[ecoledirecte-cli]
outward = ["mark"]
local = ["download", "auth-sync", "link"]

[email-cli]
local = ["auth-sync", "connect", "attachments"]
read = ["connect-status"]

[fbarchive-cli]
local = ["import"]

[franc-tireur-cli]
local = ["dump", "pdf", "page"]

[gdrive-cli]
outward = ["drive rename", "drive import", "sheets write", "sheets write-formula", "sheets batch-write", "sheets clear"]
local = ["auth-sync", "drive download", "connect", "set-default"]
read = ["pipeline pdf-to-table"]

[impots-cli]
# `message` marks the opened threads read on the site and, with --save, writes files.
local = ["download", "message"]

[laposte-cli]
outward = ["send"]
local = ["auth-sync"]

[macos-osascript-cli]
outward = ["run", "tell"]

[milibris-cli]
local = ["set-host", "dump", "pdf"]

[matera-cli]
read = ["connect"]
local = ["download", "sync", "ledger"]

[myoralia-cli]
local = ["documents download", "documents sync", "connect"]

[notion-cli]
outward = ["append", "create", "update", "edit", "delete", "delete-block", "comment", "rewrite", "check", "resolve-discussion", "view", "agents apply"]
local = ["cache clear", "auth-sync", "agents pull", "agents export", "connect"]
read = ["resolve"]

[one-conv-cli]
outward = ["live join", "live leave", "live stop", "live name", "live ack", "live summarize",
  "live control node", "hr register", "hr ingest", "hr sync",
  "tune cloud push", "tune cloud synth", "tune cloud train", "tune cloud dpo", "tune cloud eval",
  "tune cloud probe", "tune cloud benchmark", "tune cloud nightly", "tune cloud clean"]
local = ["cloud chatgpt connect", "cloud claude connect", "cloud codex connect", "cloud cowork connect",
  "chatgpt sync", "cloud chatgpt pull", "cloud claude pull", "cloud codex pull", "cloud cowork pull",
  "tune cloud pull", "local feed", "live topic", "live control restore",
  "tune snapshot", "tune dataset", "tune label", "tune mood", "tune view", "tune synth", "tune train",
  "tune eval", "tune probe", "live connectors add", "live connectors rm"]

[oz-audits-cli]
outward = ["submit"]
local = ["auth-sync"]

[refero-cli]
local = ["pull"]

[rentalready-cli]
local = ["auth-sync"]

[slack-user-cli]
outward = ["send", "draft", "draft-delete", "upload", "dm-upload", "canvas-edit"]
local = ["download", "auth-sync", "default", "refresh"]
read = ["resolve", "resolve-name"]

[tg-cli]
local = ["download", "auth-sync", "link"]

[whatsapp-cli]
outward = ["send"]
local = ["import-contacts", "download", "pull", "sync", "setup", "auth-sync", "link"]

[tchoupi-cli]
local = ["pdf"]
